# Example ~/.caravan/config.toml (ROADMAP #13c). Copy what you want; every
# line is optional and a missing file is fine.
#
# Order: a choice you make on the web page (anything not Auto) wins, then
# this file, then Auto (self-tuning / Caravan's defaults).

[defaults]
# pipeline_chats = 2

# Keyed by the web model id (qwen3-30b-a3b-4bit, gemma-4-26b-a4b-4bit,
# gpt-oss-20b-mxfp4) or the model folder name.
[models."gpt-oss-20b-mxfp4"]
kv_bits = "16"        # gpt-oss can't use compressed chat memory (attention sinks)
guess_ahead = "off"
pipeline_chats = 2
thinking = "medium"   # gpt-oss: low / medium / high

[models."qwen3-30b-a3b-4bit"]
thinking = "off"      # on / off: default for the Thinking button

# Memory guard (lead Mini only). Trimmed chat turns are archived as Obsidian-style
# Markdown under memory_dir and recalled with BM25 before the next reply.
# memory_dir = "~/.caravan/memory"
# memory_safety_gb = 1.75
# memory_recall_tokens = 500

# ---- Web UI string (Models picker + Topology) -----------------------------
# Omit this whole block to keep the default 1st node (local lead) + 2nd node (SSH).
# Empty host = node does not exist. Offline hosts are shown offline and
# skipped by fit. Runtime split is still 2-stage (MAX_SPLIT_STAGES).

# [web.nodes.first]
# label = "1st node"
# host = "local"
# role = "lead"
# order = 0

# [web.nodes.second]
# label = "2nd node"
# host = "helper-mac"
# ssh = "helper-mac"
# repo = "~/.caravan/src/caravan"
# peer = "169.254.x.y:5560"
# role = "packer"
# order = 1

# Opt-in: share the local page with devices on your Tailscale network.
# The page itself stays on 127.0.0.1. Prefer `caravan remote on` / Settings
# over editing this by hand.
# [remote]
# enabled = true
